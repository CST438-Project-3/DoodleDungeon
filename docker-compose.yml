services:
  api:
    image: gradle:8.14.4-jdk21
    working_dir: /workspace
    env_file:
      - path: ./api-backend/.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dev-db:5432/doodledungeon
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    volumes:
      - ./api-backend:/workspace
      - backend-gradle-cache:/home/gradle/.gradle
    ports:
      - "8080:8080"
    command: ["gradle", "--no-daemon", "bootRun"]
    depends_on:
      dev-db:
        condition: service_healthy

  dev-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doodledungeon
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - development-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d doodledungeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-tests:
    profiles: [checks]
    image: gradle:8.14.4-jdk21
    working_dir: /workspace
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://db:5432/doodledungeon_test
      TEST_DATABASE_USERNAME: app
      TEST_DATABASE_PASSWORD: app
    volumes:
      - ./api-backend:/workspace
      - backend-gradle-cache:/home/gradle/.gradle
    command: ["gradle", "--no-daemon", "test"]
    depends_on:
      db:
        condition: service_healthy

  db:
    profiles: [checks]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doodledungeon_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d doodledungeon_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend-checks:
    profiles: [checks]
    image: ghcr.io/cst438-project-3/doodledungeon:latest
    build:
      context: ./app-frontend
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]

volumes:
  backend-gradle-cache:
  development-database:
