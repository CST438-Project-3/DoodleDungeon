# Run `docker compose up --build` to build the verification image locally.
services:
  android-checks:
    image: ghcr.io/cst438-project-3/doodledungeon:latest
    build:
      context: .
      dockerfile: Dockerfile
    # The Dockerfile runs tests and checkers while building the image. This
    # one-shot command lets `docker compose up --build` finish successfully.
    entrypoint: ["/bin/true"]
