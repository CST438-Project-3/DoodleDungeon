server:
  port: ${PORT:8080}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:8081}

app:
  jwt-secret: ${APP_JWT_SECRET}
  jwt-ttl-seconds: ${APP_JWT_TTL_SECONDS:3600}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:8081}
  admin-user-ids: ${APP_ADMIN_USER_IDS:}

spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true