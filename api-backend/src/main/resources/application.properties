spring.config.import=optional:file:./.env[.properties]
spring.application.name=doodledungeon-api
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodledungeon}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:app}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:app}}
spring.datasource.driver-class-name=org.postgresql.Driver
