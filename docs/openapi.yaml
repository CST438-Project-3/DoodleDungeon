openapi: 3.0.3
info:
  title: DoodleDungeon API
  description: Backend API for the DoodleDungeon Android app
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Users

paths:
  /auth/github:
    post:
      summary: Authenticate with GitHub
      description: Exchanges a GitHub authorization code for an app session token (JWT).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubLoginRequest'
      responses:
        '200':
          description: Successfully authenticated. Returns a session token and user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request (e.g., missing code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (e.g., invalid or expired GitHub code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google:
    post:
      summary: Authenticate with Google
      description: Exchanges a Google authorization code and PKCE verifier for an app session token (JWT).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Successfully authenticated. Returns a session token and user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request (e.g., missing code or PKCE verifier).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (e.g., invalid or expired Google code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - Users
      summary: Get the signed-in user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Sign-in is required.
        '404':
          description: The user's profile was not found.

    patch:
      tags:
        - Users
      summary: Update the signed-in user's profile
      description: Updates the user's display name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: The display name is missing or blank.
        '401':
          description: Sign-in is required.
        '404':
          description: The user's profile was not found.

    delete:
      tags:
        - Users
      summary: Delete the signed-in user's account
      description: Deletes the user's account and related data. The client clears its local session after success.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The account was deleted.
        '401':
          description: Sign-in is required.
        '404':
          description: The user's profile was not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT whose subject identifies the signed-in app user.

  schemas:
    GitHubLoginRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: The temporary authorization code received from GitHub's redirect.
          example: "abcdef1234567890"

    GoogleLoginRequest:
      type: object
      required:
        - code
        - redirectUri
        - codeVerifier
      properties:
        code:
          type: string
          description: The temporary authorization code received from Google's redirect.
        redirectUri:
          type: string
          format: uri
          description: The redirect URI used to obtain the authorization code.
        codeVerifier:
          type: string
          description: The PKCE verifier paired with the authorization request.

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Your backend's session token (like a JWT) for this user.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: integer
              example: 12345
            username:
              type: string
              example: "octocat"
            avatar_url:
              type: string
              example: "https://avatars.githubusercontent.com/u/583231?v=4"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "invalid_code"
        message:
          type: string
          example: "The provided authorization code is invalid or has expired."

    UserProfile:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true

    UpdateUserProfileRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          description: The profile name to display in the app.